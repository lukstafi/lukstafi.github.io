          - slug: causation-computation-indexicality
          - slug: indexical-unity-revised
          - slug: why-now-observer-coherence
          - slug: the-possible-the-real-and-the-actual
      - title: Physics for bounded observers
        check: >
          The Standard of Motion mentions Wolfram ten times and indexicality
