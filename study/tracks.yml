      revises understanding-without-knowledge.
    stages:
      - title: Start here
        essays:
          - slug: minds-by-degrees-draft-v2   # "A restatement of our Philosophy of Mind work"
            check: >
              Works as the entry point for the five conditions and reflexive
              closure, but its verdict on current AI and its three parallel
              subjectivities are revised in
              experience-selfhood-and-the-organization-of-a-mind. The guide
              should say so where it sends a reader here first.
