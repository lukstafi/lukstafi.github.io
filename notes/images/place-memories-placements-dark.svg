   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #8b959d" x="176.4972" y="18.3375" transform="rotate(-0 176.4972 18.3375)">A brain</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #258983" x="337.536" y="18.3375" transform="rotate(-0 337.536 18.3375)">A language model</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b7b7b7" x="7.2" y="52.306172" transform="rotate(-0 7.2 52.306172)">By position</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8b959d" x="7.2" y="66.766465" transform="rotate(-0 7.2 66.766465)">where it arrived</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(111.232473 48.509531)">Prefrontal slots: each item of a</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(111.484153 58.736094)">sequence in its own subspace,</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(137.11763 69.786094)">by ordinal position</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(265.143227 53.211094)">The key–value cache: every token</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(270.504867 64.261094)">keeps its place in the sequence</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b7b7b7" x="7.2" y="114.304531" transform="rotate(-0 7.2 114.304531)">By content</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8b959d" x="7.2" y="128.765215" transform="rotate(-0 7.2 128.765215)">what it resembles</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(106.63052 109.684844)">The hippocampal index: pointers</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(117.229622 121.558281)">to the cortical areas that an</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(143.153958 132.608281)">event activated</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(276.954242 109.684844)">LSA's buckets group keys by</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(276.248344 120.734844)">similarity. Memorilla's reader</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(265.788695 131.784844)">queries a store outside the model</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b7b7b7" x="7.2" y="176.303672" transform="rotate(-0 7.2 176.303672)">Into connections</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8b959d" x="7.2" y="190.763965" transform="rotate(-0 7.2 190.763965)">what it taught</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(117.948802 171.683594)">Replay writes the transition</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(122.086575 182.733594)">structure of episodes into</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(128.654153 193.783594)">prefrontal connections</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(277.638891 171.683594)">Nothing during deployment.</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(281.005023 182.733594)">A recurrent state changes,</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #b7b7b7" transform="translate(278.935141 194.607031)">but it ends with the session</text>
   </g>
  </g>
 </g>
