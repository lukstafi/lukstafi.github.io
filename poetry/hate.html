  <h1 class="title">hate</h1>
  <p class="subtitle">2010-05-13</p>
</header>
<section class="poem-content">
<p>***
</p>
<p>a wardrobe hugged me
</p>
<p>a fridge hugged me
</p>
<p>a wall hugged me<br>
its bare cold bone on my cheek
</p>
<p>the screen leaned over to me<br>
looked into me<br>
let me grow into its bits<br>
sink into its white
</p>
<p>why do I hate
</p>
<p>---<br>
 2010
</p>
<p>Edited 2020.</p>
