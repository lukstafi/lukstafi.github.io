<p>shore sick
</p>
<p>There she blows in the monotonous wave.<br>
A longing guides the beach weather to fall<br>
onto drizzly dunes backed by a shy horizon.<br>
The gadabout meandering scrubby tufts of grass<br>
as she floats afar a bathe a bathe --</p>
