<p>Clara
</p>
<p>He lowered the curtains to curtail the blaze<br>
as she entered, the Erklärung of the clearance.<br>
A few bright stripes on the dance floor and beyond<br>
that, Ame-no-Uzume, shining presence contained.</p>
