  <h1 class="title">choose life</h1>
  <p class="subtitle">2010-05-26</p>
</header>
<section class="poem-content">
<p>choose life
</p>
<p>choose to enter<br>
do not wait<br>
choose tension and pain<br>
choose the progression of time --<br>
choose a first<br>
and every moment, every drop<br>
stand firmly on the edge
</p>
<p>choose that someone<br>
who <strong><em>can</strong></em> come in</p>
