  <p class="subtitle">2020-02-02</p>

<section class="poem-content">
<p>The eye of the storm
</p>
<p>There it goes quiet, my mind,<br>
composed, tight-lipped,<br>
perched on folded knees,<br>
keeping to itself<br>
the teacup of storm.</p>
