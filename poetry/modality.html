  <h1 class="title">modality</h1>
  <p class="subtitle">2013-09-21</p>
</header>
<section class="poem-content">
<p><blockquote>modality</blockquote>
</p>
<p>we climb talking trees<br>
what can be<br>
what would be<br>
would it all could have been<br>
we come back to her place
</p>
<p>she climbs to my bed<br>
&quot;slowly&quot;, she says<br>
not to wake me up
</p>
<p>how does it feel --<br>
but the dream girl fades</p>
