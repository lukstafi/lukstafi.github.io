  <h1 class="title">commuting</h1>
  <p class="subtitle">2010-05-09</p>
</header>
<section class="poem-content">
<p><blockquote>***I&#x27;m commuting, room to room</blockquote>
task to task
</p>
<p>from bed to noon<br>
across the gulf of evenings<br>
Neanderthal&#x27;s sequenced genome<br>
slapstick comedies &quot;from the stream&quot;
</p>
<p>the awaiting harbors<br>
getting tougher to reach</p>
