  <h1 class="title">lament</h1>
  <p class="subtitle">2010-01-30</p>
</header>
<section class="poem-content">
<p><blockquote>lament</blockquote>
I&#x27;ve lost senses<br>
and my face<br>
but no one noticed<br>
no one knows me<br>
the body aspires<br>
and there&#x27;s a hearty smile
</p>
<p>the empty core<br>
cannot see<br>
cannot smell</p>
