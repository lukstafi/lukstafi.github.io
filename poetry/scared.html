  <h1 class="title">scared</h1>
  <p class="subtitle">2011-07-06</p>
</header>
<section class="poem-content">
<p>scared
</p>
<p>I&#x27;m so scared<br>
of touching you<br>
I&#x27;m scared<br>
of the hurt I&#x27;ve done<br>
and am going to do<br>
I&#x27;m scared<br>
of not being grown-up<br>
up to dreaming of you
</p>
<p>I&#x27;m scared to death<br>
that will us part
</p>
<p>---<br>
2008</p>
