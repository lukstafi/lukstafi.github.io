  <p class="subtitle">2019-07-18</p>

<section class="poem-content">
<p>***
</p>
<p>Imminent immanence imagined<br>
in the intricate intention<br>
Undulation underpinned by<br>
contracting and letting go<br>
Bringing in and pushing away<br>
Stepping forth and stepping back<br>
The toes walk<br>
The fingers bow<br>
The ribs wave</p>
