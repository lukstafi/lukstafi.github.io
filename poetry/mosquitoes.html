  <p class="subtitle">2009-08-18</p>

<section class="poem-content">
<p><blockquote>mosquitoes</blockquote>
it&#x27;s still hot<br>
it&#x27;s closed window
</p>
<p>it&#x27;s head over heels<br>
Monte Carlo damn it!<br>
or is it a hair?
</p>
<p>still it -- itches</p>
