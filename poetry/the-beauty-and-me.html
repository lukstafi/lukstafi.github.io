<p>The Beauty and me
</p>
<p>The monster has a soft<br>
spot beside you.<br>
The monster, little angel,<br>
in the heaven of your knitting,<br>
the clumsy, patchy hair<br>
with an ominous twitch<br>
the monster mellows out<br>
at your knees.</p>
