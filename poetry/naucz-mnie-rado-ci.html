  <h1 class="title">naucz mnie // radości</h1>
  <p class="subtitle">2008-10-27</p>
</header>
<section class="poem-content">
<p>***<br>
naucz mnie<br>
radości mieć otwarte ramiona<br>
i chwytać Twoje miłe słowa<br>
złote brzoskwinie -- na czubkach palców<br>
bo chcę dać Ci więcej<br>
naucz mnie: znowu<br>
światło czerpać pompą uśmiechu<br>
promieniować</p>
</section>
