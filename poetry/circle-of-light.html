  <h1 class="title">circle of light</h1>
  <p class="subtitle">2013-11-14</p>

<section class="poem-content">
<p><blockquote>***</blockquote>
</p>
<p>within a little circle of light<br>
a stack of books<br>
dark leaves of a plant<br>
a keyboard
</p>
<p>within me<br>
a little circle of light
</p>
<p>---<br>
from around 1997? Probably later, I don&#x27;t remember.</p>
