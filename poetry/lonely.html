  <p class="subtitle">2011-06-13</p>

<section class="poem-content">
<p><blockquote>lonely</blockquote>
without farewellgot my wheels<br>
on the shortest route out
</p>
<p>en route<br>
a flat tire<br>
a thousand miles from myself
</p>
