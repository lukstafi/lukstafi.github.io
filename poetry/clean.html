  <p class="subtitle">2009-07-31</p>

<section class="poem-content">
<p>clean
</p>
<p>I take the<br>
morning waterfall shiver<br>
into sunlight.<br>
I make the bed.<br>
I stuff the clothes<br>
into the basket<br>
and wash the floor.<br>
Until there&#x27;s a place,<br>
a possibility.
</p>
<p>I&#x27;m clean.</p>
