  <h1 class="title">ideal glass</h1>
  <p class="subtitle">2020-10-02</p>
</header>
<section class="poem-content">
<p>ideal glass
</p>
<p>in an aikido class<br>
the sensei&#x27;s rolls slow down<br>
he becomes a white stone in the river
</p>
<p>in an undersea movie<br>
a torso of salt water<br>
where is it going?<br>
like a magnifying glass<br>
exploring the room
</p>
<p>the river moves in unison</p>
